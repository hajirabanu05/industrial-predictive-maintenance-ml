services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: predictive_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: predictive_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    restart: unless-stopped